name: Diagnose Eval Latency

# [一時的] judge フェーズが CI でのみ約 30 倍遅い原因を切り分けるための手動ワークフロー。
# 呼び出しは 1 層あたり 3 回 × 3 層 = 9 回程度で、課金への影響は無視できる。
# 原因が判明したら evals/diagnose_latency.py ごと削除すること。

# ⚠️ トリガーは pull_request でなければならない。eval ロール (llmops-rag-dev-eval-ci) の
# trust policy が許可している sub は `:pull_request` と `:ref:refs/heads/main` の 2 つだけで、
# ブランチへの push は `:ref:refs/heads/<branch>` になり AssumeRoleWithWebIdentity が通らない。
# workflow_dispatch も使えない (ワークフローがデフォルトブランチに存在する必要があり、
# この診断のために main を触りたくない)。
#
# 診断スクリプトを evals/ ではなく scripts/ に置いているのは、eval.yml のパス判定
# `^(app/|evals/|pyproject.toml|uv.lock|.github/workflows/eval.yml)` に一致させないため。
# evals/ に置くと診断のたびに 60 分 / 約 $1 の本番 eval が巻き添えで走ってしまう。
on:
  pull_request:
    paths:
      - "scripts/diagnose_latency.py"
      - ".github/workflows/diagnose-eval-latency.yml"

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: uv sync (eval グループ込み)
        run: uv sync --frozen --group eval

      - name: Configure AWS credentials (eval, read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_EVAL }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 層ごとのレイテンシを計測
        run: uv run python scripts/diagnose_latency.py
