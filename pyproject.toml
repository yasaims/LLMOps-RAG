[project]
name = "llmops-rag"
version = "0.1.0"
description = "AWS ドキュメントQ&A RAGシステム + LLMOps基盤"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pypdf>=5.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "mangum>=0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
    "integration: DB/Bedrock を実際に叩くテスト (CIでは除外)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
